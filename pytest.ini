[pytest]
# Test discovery
testpaths       = tests
python_files    = test_*.py
python_classes  = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Custom markers (use @pytest.mark.<name> to tag tests)
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require live services (Qdrant, Ollama)