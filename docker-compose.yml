# docker-compose.yml — Study-in-Germany AI Advisor
#
# SERVICES
# ────────
# qdrant   — vector database (official image, no config needed)
# api      — FastAPI backend (built from Dockerfile)
# ollama   — local LLM server for enrichment/planning roles
# ui       — Streamlit frontend
#
# QUICK START
# ───────────
#   cp .env.example .env          # fill in GEMINI_API_KEY and JWT_SECRET_KEY
#   docker compose up --build     # first run: downloads models (~4.6 GB, once)
#   open http://localhost:8501     # Streamlit UI
#   open http://localhost:8000/docs # FastAPI Swagger UI
#
# VOLUMES
# ───────
# qdrant_data    → Qdrant index (vector embeddings, persists between restarts)
# hf_cache       → HuggingFace model cache (bge-m3 + reranker, ~4.6 GB, downloads once)
# ollama_models  → Ollama model weights (qwen3:1.7b, ~1.1 GB, pulls once)
# app_data       → SQLite database + uploaded PDFs
#
# NOTES FOR M2 / APPLE SILICON
# ──────────────────────────────
# Docker Desktop on Apple Silicon runs containers via Rosetta 2 (x86 emulation)
# by default.  For native ARM performance, ensure Docker Desktop → Settings →
# "Use Rosetta for x86/amd64 emulation" is ON, or use colima with --arch arm64.
# MPS acceleration for the reranker is NOT available inside Docker on macOS
# (MPS is a host GPU API and doesn't pass through to containers).
# The reranker will run on CPU inside Docker — still fast enough for demo use.

services:

  # ── Qdrant vector store ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API (used by qdrant-client)
      - "6334:6334"   # gRPC (not used, but exposed for tooling)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6333/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama local LLM server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Pull the planning/enrichment model on first startup.
    # Change this to match ENRICHMENT_MODEL / PLANNING_MODEL in your .env.
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull ${OLLAMA_MODEL:-qwen3:1.7b} &&
             wait"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"    # keep model loaded in RAM between calls
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:11434/api/tags')\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s   # model pull can take a while

  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost URLs to use Docker service names
      QDRANT_URL:     "http://qdrant:6333"
      OLLAMA_BASE_URL: "http://ollama:11434"
      HF_HOME:        "/app/.cache/huggingface"
      # Tell HuggingFace to use only local cache after first download
      # Set to 0 to allow re-downloading (e.g. after clearing the volume)
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    volumes:
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
      - app_data:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # model loading on first boot takes 30-60s

  # ── Streamlit frontend ────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: rag_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_BASE: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy


# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  qdrant_data:
    driver: local
  hf_cache:
    driver: local
  ollama_models:
    driver: local
  app_data:
    driver: local