# docker-compose.yml — Study-in-Germany AI Advisor
#
# SERVICES
# ────────
# qdrant   — vector database (official image, no config needed)
# api      — FastAPI backend (built from Dockerfile)
# ollama   — local LLM server for enrichment/planning roles
# ui       — Streamlit frontend
#
# QUICK START
# ───────────
#   cp .env.example .env          # fill in GEMINI_API_KEY and JWT_SECRET_KEY
#   docker compose up --build     # first run: downloads models (~4.6 GB, once)
#   open http://localhost:8501     # Streamlit UI
#   open http://localhost:8000/docs # FastAPI Swagger UI
#
# VOLUMES
# ───────
# qdrant_data    → Qdrant index (vector embeddings, persists between restarts)
# hf_cache       → HuggingFace model cache (bge-m3 + reranker, ~4.6 GB, downloads once)
# ollama_models  → Ollama model weights (qwen3:1.7b, ~1.1 GB, pulls once)
# app_data       → SQLite database + uploaded PDFs
#
# HEALTHCHECK STRATEGY
# ─────────────────────
# qdrant / ollama   → NO healthcheck. These are third-party minimal images
#                     that ship without curl, wget, or Python. Instead, the
#                     api service uses `restart: on-failure` + `start_period`
#                     to retry until both dependencies are ready.
# api               → checked with Python's stdlib urllib (Python is always
#                     present because we built the image FROM python:3.12-slim).
# ui                → checked via Streamlit's built-in /_stcore/health endpoint.
#
# NOTES FOR M2 / APPLE SILICON
# ──────────────────────────────
# MPS GPU access is NOT available inside Docker on macOS.
# The reranker runs on CPU inside the container — fast enough for demo use.

services:

  # ── Qdrant vector store ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck — qdrant/qdrant is a minimal image with no shell tools.
    # The api container handles the timing via restart + start_period.

  # ── Ollama local LLM server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Start server, then pull the model (downloads ~1.1 GB on first run only).
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull ${OLLAMA_MODEL:-qwen3:1.7b} &&
             wait"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    # No healthcheck — ollama/ollama is also a minimal image.
    # The api service retries the Ollama connection automatically.

  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    # on-failure ensures Docker restarts the api if it crashes because Qdrant
    # or Ollama weren't ready yet.  Combined with start_period on the
    # healthcheck this gives the whole stack time to stabilise.
    restart: on-failure
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL:      "http://qdrant:6333"
      OLLAMA_BASE_URL: "http://ollama:11434"
      HF_HOME:         "/app/.cache/huggingface"
      HF_HUB_OFFLINE:  "${HF_HUB_OFFLINE:-0}"
    volumes:
      - hf_cache:/app/.cache/huggingface
      - app_data:/app/data
      - app_data:/app/uploads
    depends_on:
      # service_started (not service_healthy) because qdrant/ollama have no
      # healthchecks.  The api's own retry logic + restart policy handles timing.
      - qdrant
      - ollama
    healthcheck:
      # python3 IS available here — we built FROM python:3.12-slim
      test: >
        CMD-SHELL python3 -c
        "import urllib.request, sys;
        urllib.request.urlopen('http://localhost:8000/');
        sys.exit(0)"
      interval: 30s
      timeout: 10s
      retries: 5
      # Give the api time to load bge-m3 + reranker on first boot (~60 s on M2)
      start_period: 120s

  # ── Streamlit frontend ────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: rag_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_BASE: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy


# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  qdrant_data:
    driver: local
  hf_cache:
    driver: local
  ollama_models:
    driver: local
  app_data:
    driver: local