[project]
name = "rag-app"
version = "3.0.0"
description = "RAG with hybrid dense+sparse search, reranking, and local embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "FlagEmbedding>=1.3.0",        # bge-m3 dense + sparse in one model
    "google-genai>=1.0.0",         # Gemini for generation only
    "inngest>=0.5.18",
    "llama-index-core>=0.14.22",
    "llama-index-readers-file>=0.6.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]
