[project]
name = "rag-app"
version = "9.0.0"
description = "Study-in-Germany AI Advisor — Multi-provider agentic RAG (Gemini/Ollama/OpenAI-compatible)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # ── API framework ──────────────────────────────────────────────────────────
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    # ── Local embedding + reranking (bge-m3 / bge-reranker-v2-m3) ─────────────
    # FlagEmbedding loads both dense (1024-dim) and sparse (BM25-style) vectors
    # from a single BAAI/bge-m3 model — no separate sparse model needed.
    # On M2: model downloads once to ~/.cache/huggingface and is reused.
    "FlagEmbedding>=1.3.0",
    "sentence-transformers>=3.0.0",
    # ── LLM providers (v9: multi-provider via llm_providers.py) ────────────────
    # google-genai — used for the "answer" role by default, and for web search
    # grounding (real-time deadline lookups in web_search_tool.py).
    "google-genai>=1.0.0",
    # requests — used by OllamaProvider for local HTTP calls to localhost:11434.
    # No extra setup needed; Ollama itself is a separate binary (brew install ollama).
    "requests>=2.32.0",
    # ── Vector store ───────────────────────────────────────────────────────────
    "qdrant-client>=1.18.0",
    # ── PDF loading and chunking ───────────────────────────────────────────────
    "llama-index-core>=0.14.22",
    "llama-index-readers-file>=0.6.0",
    # pypdf — already pulled in transitively by llama-index-readers-file, but
    # pinned explicitly because streamlit_app.py imports it directly to
    # estimate ingestion time (page count → expected enrichment batches).
    "pypdf>=4.0.0",
    # ── Numerical operations (vector similarity in recommender) ────────────────
    "numpy>=1.26.0",
    # ── Streamlit UI ───────────────────────────────────────────────────────────
    "streamlit>=1.58.0",
    # ── Utilities ─────────────────────────────────────────────────────────────
    "python-dotenv>=1.2.2",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.3.0",  # JWT (used by auth.py)
]

[project.optional-dependencies]
# Install with: uv sync --extra openai-compat
# Only needed if you set ENRICHMENT_PROVIDER / PLANNING_PROVIDER / ANSWER_PROVIDER
# to "openai", "deepseek", "kimi", "moonshot", or "qwen_cloud" in .env.
# Not needed for the default setup (Ollama for enrichment/planning, Gemini for answers).
openai-compat = [
    "openai>=1.40.0",
]

# Install with: uv sync --extra dev
# Run tests with: uv run pytest
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",   # for any async test cases
    "httpx>=0.27.0",             # required by FastAPI TestClient
    "passlib[bcrypt]>=1.7.4",   # password hashing (also a runtime dep via auth.py)
]

# ── Notes for M2 / 8 GB RAM ───────────────────────────────────────────────────
# torch is a transitive dependency of FlagEmbedding and sentence-transformers.
# uv / pip will install the CPU-only torch build by default on macOS ARM.
# If you want MPS acceleration for the reranker (faster), run:
#   uv add torch --extra-index-url https://download.pytorch.org/whl/cpu
# The reranker already auto-detects MPS via _detect_device() in reranker.py.
#
# Model sizes (downloaded once, then cached):
#   BAAI/bge-m3              ~2.3 GB   (Python process, via FlagEmbedding)
#   BAAI/bge-reranker-v2-m3  ~2.3 GB   (Python process, via FlagEmbedding)
#   qwen3:1.7b               ~1.1 GB   (separate Ollama process, NOT in Python RAM)
# Total Python-process RAM: ~4.6 GB.  Ollama runs as a sibling process (~1.1 GB).
# Combined: ~5.7 GB, leaving ~2.3 GB headroom on an 8 GB M2.